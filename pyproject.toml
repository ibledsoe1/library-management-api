[project]
name = "library-management-api"
version = "0.1.0"
description = "An API for managing a library. This includes it's members and books."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.116.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "mockito>=1.5.4",
    "pytest>=9.1.1",
    "testcontainers[postgres]>=4.15.0",
]